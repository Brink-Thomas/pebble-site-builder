<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pebble – Edit your website</title>
  <!-- editor.css styles the editor's own UI (bars, outlines, dialogs). -->
  <link rel="stylesheet" href="editor.css">
  <!-- The website's own design, so the canvas looks like the real site:
       global.css (built live from Site Settings) and the optional theme.css. -->
  <style id="site-theme"></style>
  <style id="site-custom"></style>
</head>
<body class="editor">
  <!-- The whole editor is drawn here by Preact, from one JSON tree (app.js). -->
  <div id="app"></div>

  <!-- Lucide: the one icon set used everywhere in the editor. -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="../lib/config.js"></script>
  <script src="../lib/auth.js"></script>
  <script src="../lib/design.js"></script>
  <script src="../lib/legacy-format.js"></script>
  <script src="../lib/site-state.js"></script>
  <script src="../lib/compiler.js"></script>
  <script src="../lib/github-service.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
